[project]
name = "swim-lanes"
version = "1.0.0"
description = "Native steps for swim lane scripts in Python (the swim.lane/v1 protocol)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["swim"]
