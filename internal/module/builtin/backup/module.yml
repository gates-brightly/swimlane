schema: swim.module/v1
name: backup
version: 1.0.0
kind: go
summary: take a restore point before a change (an RDS snapshot, a DynamoDB backup), wait until it's usable, and record its id
commands: [backup]
usage:
  - mod backup rds INSTANCE [--for 60m] [--key K]           an RDS instance snapshot
  - mod backup rds-cluster CLUSTER [--for 60m] [--key K]    an Aurora cluster snapshot
  - mod backup dynamodb TABLE [--for 60m] [--key K]         an on-demand DynamoDB backup
  - mod_env backup ...    also gives the round BACKUP_ID, BACKUP_KIND and BACKUP_SOURCE (for on_failure)
effects:
  network: [rds.amazonaws.com, dynamodb.amazonaws.com]
