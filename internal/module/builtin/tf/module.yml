schema: swim.module/v1
name: tf
version: 1.0.0
kind: go
summary: Terraform plan as the round's evidence, then apply exactly that saved plan
commands: [tf]
usage:
  - mod --evidence tf plan DIR [--var-file F]... [--var K=V]... [--bin terraform|tofu|PATH] [--no-init] [--lock-timeout D]
  - mod tf apply DIR [--bin ...] [--lock-timeout D]    the plan saved this round, checked, inside a guard
effects:
  network: [the providers' APIs, the state backend]
  writes: [DIR/.terraform]
read_only_for: [plan]
destructive_for: [apply]
