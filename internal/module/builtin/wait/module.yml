schema: swim.module/v1
name: wait
version: 1.0.0
kind: go
summary: wait until a service is ready, judged by an HTTP status or an exit code, never by matching output
commands: [wait]
usage:
  - mod wait http URL [--status 2xx|200,204] [--for 10m] [--every 5s]
  - mod wait tcp HOST:PORT [--for 10m] [--every 5s]
  - mod wait cmd [--for 10m] [--every 5s] -- CMD [ARGS...]    until CMD exits 0
  - mod wait kube-rollout RESOURCE [--namespace N] [--context C] [--for 10m]
effects:
  network: [the URL's or HOST's host]
  read_only: true
