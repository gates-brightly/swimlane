schema: swim.module/v1
name: target
version: 1.0.0
kind: go
summary: stop unless the AWS account, Kubernetes context or GCP project in use is the one the lane says
commands: [target]
usage:
  - mod --gate target aws --account 123456789012 [--region R] [--profile P]
  - mod --gate target kube --context C [--namespace N] [--server URL]
  - mod --gate target gcp --project P [--account A]
effects:
  network: [sts.amazonaws.com]
  read_only: true
gate: true                 # a wrong target stops the round, with or without mod --gate
