schema: swim.module/v1
name: aws-session
version: 1.0.0
kind: go
summary: AWS credentials from the operator's profile or SSO, optionally assuming a role, for the steps after it
commands: [aws-session]
usage:
  - mod_env aws-session --profile P [--role ARN] [--duration 1h] [--region R] [--session-name N]
effects:
  network: [sts.amazonaws.com]
  credentials: true
  read_only: true
