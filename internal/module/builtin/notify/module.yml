schema: swim.module/v1
name: notify
version: 1.0.0
kind: bash
summary: post a message to a Slack incoming webhook or a generic JSON webhook
commands: [notify]
usage:
  - mod notify [--strict] CHANNEL TEXT    CHANNEL is "#name", or - for the webhook's own; fails soft unless --strict
effects:
  network: [the webhook's host]
  secrets: [SLACK_WEBHOOK_URL]
