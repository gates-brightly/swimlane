name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Lane scripts and e2e/run.sh must work on macOS's /bin/bash 3.2. Runner
      # images also ship a newer bash; put 3.2 first so every `bash` (the
      # launcher's, the scenario runner's, #!/usr/bin/env bash) is 3.2.
      - name: Use macOS system bash 3.2
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/bash32"
          ln -sf /bin/bash "$HOME/bash32/bash"
          echo "$HOME/bash32" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          bash --version | head -1
          go version

      # swim tests itself: the CI is lane 1, the committed group file
      # lanes.ci.sh, run by the swim built from this checkout (settings in
      # swim.yml). Its jobs run in order: fmt (1.1), lint (1.2) and unit
      # tests (1.3) are Always, then e2e (1.4). Same as `make ci` locally.
      - name: Build swim from this checkout
        run: |
          go build -o "$RUNNER_TEMP/swim-bin/swim" ./cmd/swim
          echo "$RUNNER_TEMP/swim-bin" >> "$GITHUB_PATH"

      - name: swim ci (fmt, lint, test, then e2e)
        run: swim ci --junit swim.xml

      - name: Upload swim logs and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swim-${{ matrix.os }}
          path: |
            .swim/logs
            .swim.log
            swim.xml
          if-no-files-found: ignore
          include-hidden-files: true   # .swim/ and .swim.log start with a dot

      - name: Keep scenario repos on failure
        if: failure()
        run: e2e/run.sh -k || true
