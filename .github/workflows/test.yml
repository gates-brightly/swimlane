name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Named images, not -latest: an image change between two runs
        # shouldn't be what turns main red. ubuntu-latest becomes Ubuntu 26
        # from 2026-10-19; try ubuntu-26.04 alongside once main is green
        # (revisit by 2026-12-01). macOS is for bash 3.2 and BSD userland.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Lane scripts and e2e/run.sh must work on macOS's /bin/bash 3.2. Runner
      # images also ship a newer bash; put 3.2 first so every `bash` (the
      # launcher's, the scenario runner's, #!/usr/bin/env bash) is 3.2.
      - name: Use macOS system bash 3.2
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/bash32"
          ln -sf /bin/bash "$HOME/bash32/bash"
          echo "$HOME/bash32" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
          bash --version | head -1
          go version

      # swim tests itself: the CI is five committed lanes, run by the swim
      # built from this checkout (settings in swim.yml). Lane 1 (fmt, lint,
      # unit tests, race) runs first; then e2e (2), fault injection (3),
      # security (4) and fuzzing (6) run side by side. Same as `just ci`
      # locally.
      - name: Build swim from this checkout
        run: |
          go build -o "$RUNNER_TEMP/swim-bin/swim" ./cmd/swim
          echo "$RUNNER_TEMP/swim-bin" >> "$GITHUB_PATH"

      # A failed e2e scenario's scratch repo is kept under E2E_KEEP_FAILED
      # (e2e/run.sh) and uploaded below; the e2e step's annotation names
      # each failed Go test (e2etool gotest-report).
      - name: swim ci (checks, then e2e, fault, security, fuzz)
        run: swim ci --junit swim.xml
        env:
          E2E_KEEP_FAILED: ${{ runner.temp }}/swim-e2e-failed

      - name: Upload swim logs and JUnit
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: swim-${{ matrix.os }}
          path: |
            .swim/logs
            .swim.log
            swim.xml
            e2e*.xml
            ${{ runner.temp }}/swim-e2e-failed
          if-no-files-found: ignore
          include-hidden-files: true   # .swim/ and .swim.log start with a dot
