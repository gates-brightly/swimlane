name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Lane scripts and e2e/run.sh must work on macOS's /bin/bash 3.2. Runner
      # images also ship a newer bash; put 3.2 first so every `bash` (the
      # launcher's, the scenario runner's, #!/usr/bin/env bash) is 3.2.
      - name: Use macOS system bash 3.2
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/bash32"
          ln -sf /bin/bash "$HOME/bash32/bash"
          echo "$HOME/bash32" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          bash --version | head -1
          go version

      # swim tests itself: the CI rounds are committed lane scripts (lane.1.sh
      # lint, lane.2.sh unit tests, lane.3.sh e2e; settings in swim.yml), run
      # by the swim built from this checkout. Same as `make ci` locally.
      - name: Build swim from this checkout
        run: |
          go build -o "$RUNNER_TEMP/swim-bin/swim" ./cmd/swim
          echo "$RUNNER_TEMP/swim-bin" >> "$GITHUB_PATH"

      - name: swim ci
        run: swim ci --rerun --junit swim.xml

      - name: Upload swim logs and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swim-${{ matrix.os }}
          path: |
            .swim/logs
            .swim.log
            swim.xml
          if-no-files-found: ignore

      - name: Keep scenario repos on failure
        if: failure()
        run: e2e/run.sh -k || true
