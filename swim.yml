# swim.yml: this repo's committed swim settings (the same keys as a repos
# entry in ~/.config/swim/config.yml; your own repos entry overrides them).
# The CI rounds are lane.1.sh (lint), lane.2.sh (unit tests) and lane.3.sh
# (e2e): GitHub Actions runs them with `swim ci`, and `swim all` (or
# `make ci`) runs the same rounds locally.
lanes: 3
header_env: [GOFLAGS, GITHUB_REF_NAME, RUNNER_OS]
term_grace: 30s
