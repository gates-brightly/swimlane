# swim.yml: this repo's committed swim settings (the same keys as a repos
# entry in ~/.config/swim/config.yml; your own repos entry overrides them).
# The CI is lane 1, the group file lanes.ci.sh: jobs 1.1-1.3 (fmt, lint,
# unit tests) are Always and run first; 1.4 (e2e) runs after them. Other
# lanes are for rounds (swim shows the lanes in use; there's no count).
# GitHub Actions runs them with `swim ci`, and `make ci` runs the same
# rounds locally.
header_env: [GOFLAGS, GITHUB_REF_NAME, RUNNER_OS]
term_grace: 30s
